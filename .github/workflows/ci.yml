name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: voidzero-dev/setup-vp@49c3e4e92c52e7f8392712a9267bbe71c5ab30e5 # v1.19.0
        with:
          cache: true

      # The sample app imports touchpress through its exports map, which points at dist, so the
      # workspace has to be built before the typecheck can resolve it.
      - run: vp run -r build

      - run: vp check

      # The Vitest specs are the Playwright specs with one import line changed, and this keeps them so.
      - run: node apps/e2e/scripts/spec-parity.mjs

      - run: vp test
